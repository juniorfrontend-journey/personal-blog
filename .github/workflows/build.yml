# Mỗi lần Decap CMS lưu bài (hoặc Atlas sửa build.py/template), chạy build.py
# để dựng lại các file HTML rồi commit về main. Vercel thấy main đổi thì tự
# deploy lại. Commit của workflow chỉ đụng file HTML ở root nên không tự
# kích hoạt lại chính nó (cộng thêm [skip ci]).
name: Build blog

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'build.py'
      - 'stitch/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cài thư viện build
        run: pip install markdown pyyaml
      - name: Build site
        run: python3 build.py --out .
      - name: Commit site đã build
        run: |
          git config user.name "Atlas Bot"
          git config user.email "atlas@jackethee.dev"
          git add index.html bai-viet.html gioi-thieu.html rss.xml
          git add -A bai-viet/
          git diff --cached --quiet || git commit -m "chore: rebuild site [skip ci]"
          git push
